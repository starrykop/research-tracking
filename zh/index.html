<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科研工作台（多语言）</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --ink:#1f2430; --sub:#6b7280; --line:#e6e9f0;
    --brand:#4f46e5; --brand-soft:#eef0ff; --shadow:0 1px 3px rgba(17,24,39,.06),0 8px 24px rgba(17,24,39,.06);
    --radius:14px;
    --gray:#94a3b8; --blue:#2563eb; --purple:#7c3aed; --orange:#ea580c; --teal:#0d9488;
    --green:#16a34a; --red:#dc2626; --amber:#d97706;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
  /* header */
  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);
    display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 6px 16px rgba(99,102,241,.35)}
  .brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
  .brand p{margin:2px 0 0;color:var(--sub);font-size:12.5px}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-size:13.5px;transition:.15s}
  .btn{padding:9px 15px;background:var(--panel);border:1px solid var(--line);color:var(--ink);display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
  .btn:hover{border-color:#cfd4e2;transform:translateY(-1px)}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 6px 16px rgba(79,70,229,.3)}
  .btn.primary:hover{background:#4338ca}
  .btn.ghost{background:transparent;box-shadow:none}
  .btn.sm{padding:6px 10px;font-size:12.5px}
  .btn.danger{color:var(--red)}
  .btn.danger:hover{background:#fef2f2;border-color:#fecaca}

  /* stats */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .stat .k{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .stat .v{font-size:26px;font-weight:750;margin-top:6px;letter-spacing:.5px}
  .stat .v small{font-size:13px;color:var(--sub);font-weight:500;margin-left:4px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}

  .charts{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-bottom:20px}
  .charts .span2{grid-column:1/-1}
  @media(max-width:820px){.charts{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .chart-card{padding:16px 18px}
  .chart-card h3{margin:0 0 12px;font-size:14px;font-weight:650;display:flex;align-items:center;gap:7px}
  .chart-card.compact{padding:11px 13px}
  .chart-card.compact h3{font-size:12.5px;margin-bottom:9px;gap:6px}
  .chart-card.compact .legend{font-size:11px;margin-top:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;font-size:12px;color:var(--sub)}
  .legend span{display:flex;align-items:center;gap:5px}

  /* toolbar */
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;background:var(--panel)}
  .search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--sub)}
  select.filter{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13.5px;color:var(--ink)}
  select.filter:focus{outline:none;border-color:var(--brand)}

  /* list */
  .list{display:flex;flex-direction:column;gap:12px}
  .paper-card,.sub{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .paper-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gray)}
  .paper-card.s-accepted::before{background:var(--green)} .paper-card.s-rejected::before{background:var(--red)}
  .paper-card.s-review::before{background:var(--purple)} .paper-card.s-prep::before{background:var(--gray)}
  .paper-card.s-withdrawn::before{background:#64748b}
  .sub::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gray)}
  .sub.s-accepted::before{background:var(--green)} .sub.s-rejected::before{background:var(--red)}
  .sub.s-review::before{background:var(--purple)} .sub.s-submitted::before{background:var(--blue)}
  .sub.s-major::before{background:var(--orange)} .sub.s-minor::before{background:var(--teal)}
  .sub.s-prep::before{background:var(--gray)} .sub.s-withdrawn::before{background:#64748b}
  .sub-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .sub-title{font-size:15.5px;font-weight:680;margin:0 0 4px;line-height:1.4}
  .journal-line{color:var(--sub);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .b-zone{background:#fef3c7;color:#92400e} .b-if{background:#dbeafe;color:#1e40af}
  .b-zone2{background:#f1f5f9;color:#64748b;font-weight:500}
  .level-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .lvl-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid #e2e8f0;border-radius:20px;font-size:12.5px;cursor:pointer;user-select:none;background:#fff;transition:.15s}
  .lvl-chip:hover{border-color:#cbd5e1;background:#f8fafc}
  .lvl-chip:has(input:checked){border-color:var(--brand);background:#eef2ff}
  .lvl-chip input{accent-color:var(--brand);margin:0}
  .lv-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
  .status-badge{padding:4px 11px;border-radius:20px;font-size:12px;font-weight:650;color:#fff;white-space:nowrap}
  .st-prep{background:var(--gray)} .st-submitted{background:var(--blue)} .st-review{background:var(--purple)}
  .st-major{background:var(--orange)} .st-minor{background:var(--teal)} .st-accepted{background:var(--green)}
  .st-rejected{background:var(--red)} .st-withdrawn{background:#64748b} .st-revising{background:var(--orange)}
  .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--sub)}
  .meta b{color:var(--ink);font-weight:600}
  .deadline-tag{padding:3px 10px;border-radius:8px;font-weight:600;font-size:12px}
  .stage-tag{display:inline-block;vertical-align:middle;padding:2px 9px;border-radius:8px;font-weight:600;font-size:12px;white-space:nowrap}
  .j-tag{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0;white-space:normal;word-break:break-all}
  .dl-soon{background:#fffbeb;color:var(--amber);border:1px solid #fde68a}
  .dl-over{background:#fef2f2;color:var(--red);border:1px solid #fecaca}
  .dl-ok{background:#f1f5f9;color:var(--sub)}
  .sub-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  .coauthors{color:var(--sub);font-size:12.5px;margin-top:6px}
  .en-title{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:4px;line-height:1.4}
  .lang-badge{display:inline-block;background:#eef2ff;color:#4338ca;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:600;margin-left:6px}

  /* timeline */
  .timeline{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:none}
  .timeline.open{display:block}
  .tl-item{display:flex;gap:12px;padding:7px 0;position:relative}
  .tl-item:not(:last-child)::after{content:"";position:absolute;left:5px;top:20px;bottom:-7px;width:2px;background:var(--line)}
  .tl-dot{width:12px;height:12px;border-radius:50%;margin-top:4px;flex-shrink:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .tl-body{flex:1}
  .tl-body .t{font-size:13px;font-weight:600}
  .tl-body .d{font-size:12px;color:var(--sub)}
  .tl-body .n{font-size:12.5px;color:#4b5563;margin-top:3px;white-space:pre-wrap}
  .tl-acts{margin-left:auto;display:flex;gap:4px;align-items:flex-start;flex-shrink:0}
  .tl-acts .a-flag{padding:2px 7px;font-size:12px}
  .tl-acts .a-del{font-size:15px;padding:0 4px}
  .round-chip{display:inline-block;background:var(--brand-soft);color:var(--brand);padding:1px 8px;border-radius:6px;font-size:11px;font-weight:600;margin-left:6px}

  /* paper view */
  .back-btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13.5px;box-shadow:var(--shadow);margin-bottom:16px}
  .back-btn:hover{border-color:#cfd4e2}
  .paper-head{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .paper-head h2{margin:0 0 6px;font-size:20px;font-weight:720}
  .paper-subtitle{margin:-2px 0 8px;line-height:1.4}
  .paper-head .pa{color:var(--sub);font-size:13px}
  .paper-notes{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:#475569;white-space:pre-wrap}
  .paper-notes.empty{color:var(--sub);font-style:italic}
  .paper-charts{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:16px}
  @media(max-width:820px){.paper-charts{grid-template-columns:1fr}}

  /* empty */
  .empty{text-align:center;padding:70px 20px;color:var(--sub)}
  .empty .ic{font-size:52px;opacity:.5}
  .empty h3{margin:14px 0 6px;color:var(--ink);font-weight:650}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border-radius:16px;width:100%;max-width:560px;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal-head h2{margin:0;font-size:16.5px;font-weight:700}
  .modal-body{padding:20px 22px;max-height:65vh;overflow:auto}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:#374151}
  .field label .opt{color:var(--sub);font-weight:400}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;background:var(--panel);color:var(--ink)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .field textarea{resize:vertical;min-height:70px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:520px){.row2,.row3{grid-template-columns:1fr}}
  .journal-input{display:flex;gap:8px}
  .journal-input input{flex:1}
  .hint{font-size:11.5px;color:var(--sub);margin-top:5px}
  .hint.err{color:var(--red)} .hint.ok{color:var(--green)}
  .x{background:none;border:none;font-size:22px;color:var(--sub);cursor:pointer;line-height:1;padding:0 4px}
  .key-status{font-size:12px;padding:3px 9px;border-radius:6px;background:#f1f5f9;color:var(--sub)}
  .key-status.set{background:#dcfce7;color:var(--green)}
  .divider{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:var(--sub);font-size:12.5px;font-weight:600}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  a{color:var(--brand)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 学科多选（combobox 文本框匹配） */
  .combo{position:relative}
  .combo-input{width:100%}
  .combo-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:240px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,30,60,.12);z-index:30;padding:4px}
  .combo-item{padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .combo-item:hover{background:#f1f5ff}
  .combo-item.on{background:#eef2ff;color:var(--brand);font-weight:600}
  .combo-item .tick{color:var(--brand);font-weight:700}
  .combo-add{padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:#047857;font-weight:600}
  .combo-add:hover{background:#ecfdf5}
  .combo-empty{padding:8px 10px;color:var(--sub);font-size:12.5px}
  .disc-sel-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .disc-sel{display:inline-flex;align-items:center;gap:5px;padding:4px 6px 4px 11px;border-radius:20px;background:var(--brand);color:#fff;font-size:12.5px;font-weight:600}
  .disc-sel .x{border:none;background:rgba(255,255,255,.25);color:#fff;width:18px;height:18px;border-radius:50%;cursor:pointer;line-height:1;font-size:13px;flex-shrink:0}
  .disc-sel .x:hover{background:rgba(255,255,255,.45)}
  /* 作者模块 */
  .author-box{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .author-chip{display:inline-flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
  .author-chip .a-role{color:var(--sub);font-size:12px}
  .author-chip.edit{justify-content:space-between}
  .author-chip .a-flags{display:flex;align-items:center;gap:6px}
  .author-chip.edit{cursor:grab}
  .author-chip.edit:active{cursor:grabbing}
  .author-chip.edit.drag-over{outline:2px dashed var(--brand);outline-offset:2px;background:#eef2ff}
  .author-chip .a-name{cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .author-chip .a-name:hover{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
  .author-chip .a-edit-pen{color:var(--sub);font-size:11px;opacity:.45}
  .author-chip .a-name:hover .a-edit-pen{opacity:1}
  .author-edit-input{font-size:13px;padding:2px 6px;border:1px solid var(--brand);border-radius:6px;width:130px;outline:none}
  .ae-edit{display:inline-flex;align-items:center;gap:5px}
  .ae-btn{width:24px;height:24px;border:1px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer;font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
  .ae-btn:hover{border-color:var(--brand)}
  .ae-btn.ae-x{color:var(--red)}
  .drag-grip{color:#94a3b8;font-size:13px;letter-spacing:-2px;cursor:grab;user-select:none;padding:0 2px}
  .drag-grip:hover{color:var(--brand)}
  .a-flag{font-size:11.5px;padding:3px 9px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;transition:.15s}
  .a-flag:hover{border-color:#cfd4e2}
  .a-flag.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .a-del{font-size:16px;color:var(--red);background:none;border:none;cursor:pointer;line-height:1;padding:0 4px}
  .clog-ver{padding:12px 0;border-bottom:1px solid var(--line)}
  .clog-ver:last-child{border-bottom:none}
  .clog-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .clog-v{font-weight:720;font-size:15px;color:var(--brand)}
  .clog-date{font-size:12.5px;color:var(--sub)}
  .clog-cur{font-size:11px;background:var(--green);color:#fff;padding:1px 8px;border-radius:8px}
  .clog-items{margin:0;padding-left:18px;color:#475569;font-size:13px;line-height:1.9}
  .clog-items li{margin:0}
  .author-chips-inline{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .author-chips-inline .author-chip{background:#f8fafc}
  /* 工作中状态卡片描边 */
  .paper-card.s-working{border-left-color:var(--amber)}
  /* 分组折叠 */
  .group-head{display:flex;align-items:center;gap:10px;padding:12px 14px;margin:18px 0 10px;background:var(--panel);border:1px solid var(--line);border-radius:11px;cursor:pointer;box-shadow:var(--shadow);font-weight:650}
  .group-head .g-caret{transition:.2s;color:var(--sub)}
  .group-head.collapsed .g-caret{transform:rotate(-90deg)}
  .group-head .g-count{margin-left:auto;font-size:12.5px;color:var(--sub);font-weight:600;background:#f1f5f9;padding:2px 10px;border-radius:20px}
  .group-body{display:block}
  .group-head.collapsed + .group-body{display:none}
  /* 工作中面板 */
  .work-panel{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:18px;margin-bottom:16px;color:#92400e}
  .work-panel b{color:#b45309}
  .foot{text-align:center;color:var(--sub);font-size:12px;margin-top:36px}
  .foot .dev-id{margin-top:4px;color:var(--brand);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">&#128218;</div>
      <div>
        <h1>科研工作台（多语言）</h1>
        <p>本地记录 · 数据仅存本机 · 每篇论文独立文件夹 · 支持期刊等级（JCR / CSSCI 等）自动匹配</p>
      </div>
    </div>
    <div class="top-actions">
      <select class="filter" id="langSwitch" onchange="setLang(this.value)" title="语言 / Language"></select>
      <button class="btn ghost" id="btnChangelog" title="更新日志">&#128220; 更新日志</button>
      <button class="btn" id="btnSettings">&#9881;&#65039; 期刊API设置</button>
      <button class="btn" id="btnImport">&#128229; 导入</button>
      <button class="btn" id="btnExport">&#128228; 导出</button>
      <button class="btn primary" id="btnAdd">&#43; 新增项目</button>
    </div>
  </header>

  <!-- ===== 全局视图 ===== -->
  <div id="globalOnly">
    <div class="stat-grid" id="statGrid"></div>

    <div class="charts">
      <div class="card chart-card">
        <h3>&#128202; <span data-i18n="chartStatus">投稿状态分布</span></h3>
        <div id="donut"></div>
      </div>
      <div class="card chart-card">
        <h3>&#127942; <span data-i18n="chartLevel">期刊等级分布</span></h3>
        <div id="bars"></div>
      </div>
      <div class="card chart-card compact">
        <h3>&#127942; <span data-i18n="chartAccepted">已接收成果期刊等级分布</span> <span class="opt" style="font-weight:400;font-size:11px" data-i18n="chartAcceptedNote">（仅统计「已接收」状态）</span></h3>
        <div id="barsAccepted"></div>
      </div>
      <div class="card chart-card compact">
        <h3>&#128202; <span data-i18n="chartJournalTop">投稿期刊 TOP 5</span> <span style="font-weight:400;font-size:11px;color:var(--sub)" data-i18n="chartJournalNote">（投稿次数最多的5个期刊）</span>
          <select id="journalStatsSort" class="filter" style="margin-left:auto;padding:3px 7px;font-size:11px">

let currentLang = localStorage.getItem(I18N_KEY) || 'zh-CN';
if(!I18N[currentLang]) currentLang = 'zh-CN';
document.documentElement.lang = currentLang;
// 翻译函数：t('key') 或 t('key', arg1, arg2, ...) ；缺失时回退简体
function t(key, ...args){
  const pack = I18N[currentLang] || I18N['zh-CN'];
  let v = pack[key];
  if(v===undefined) v = I18N['zh-CN'][key];
  if(typeof v === 'function') return v(...args);
  return v===undefined ? key : v;
}
function setLang(code){
  if(!I18N[code]) return;
  currentLang = code;
  localStorage.setItem(I18N_KEY, code);
  document.documentElement.lang = code;
  // 重新渲染当前界面（视图不变）
  if(VIEW.mode==='paper') renderPaper(); else renderGlobal();
  applyStaticI18n();
  renderFooter();
}
// 页脚随界面语言切换（简中 / 港繁）
function renderFooter(){
  $('#foot').innerHTML='科研工作台（多语言） v'+APP_VERSION+' · '+(currentLang==='zh-TW'?'資料儲存於本機瀏覽器（localStorage）':'数据保存在本机浏览器（localStorage）')+'<div class="dev-id">开发者：Starry、Tabitha</div>';
}
// 静态文案（写在 HTML 里的）随语言刷新
function applyStaticI18n(){
  const set=(sel,txt)=>{ const el=document.querySelector(sel); if(el) el.innerHTML=txt; };
  set('#btnChangelog', '&#128220; '+t('btnChangelog'));
  set('#btnSettings', '&#9881;&#65039; '+t('btnSettings'));
  set('#btnImport', '&#128229; '+t('btnImport'));
  set('#btnExport', '&#128228; '+t('btnExport'));
  set('#btnAdd', '&#43; '+t('btnAdd'));
  set('#btnBack', '&#8592; '+t('btnBack'));
  set('#btnEditPaper', '&#9998; '+t('editPaper'));
  set('#btnNewSub', '&#8617; '+t('btnNewSub'));
  $('#search').placeholder = t('searchPlaceholder');
  $('#filterAuthor').options[0].textContent = t('allAuthors');
  $('#filterStatus').options[0].textContent = t('allStatus');
  $('#filterDiscipline').options[0].textContent = t('allDiscipline');
  $('#filterYear').options[0].textContent = t('allYear');
  $('#groupBy').options[0].textContent = t('groupNone');
  $('#groupBy').options[1].textContent = t('groupYear');
  $('#groupBy').options[2].textContent = t('groupDiscipline');
  $('#groupBy').options[3].textContent = t('groupAuthor');
  $('#groupBy').options[4].textContent = t('groupStatus');
  $('#sortBy').options[0].textContent = t('sortRecentStage');
  $('#sortBy').options[1].textContent = t('sortSubmit');
  $('#sortBy').options[2].textContent = t('sortTitle');
  $('#sortBy').options[3].textContent = t('sortStage');
  // data-i18n 属性统一填充
  document.querySelectorAll('[data-i18n]').forEach(el=>{ const k=el.getAttribute('data-i18n'); if(k) el.textContent=t(k); });
  // 顶部副标题
  const sub=document.querySelector('.brand p'); if(sub) sub.textContent=t('appSub');
  // 语言切换器选中态
  const sel=document.querySelector('#langSwitch'); if(sel) sel.value=currentLang;
}
// 初始化语言切换器选项

}

/* ===================== 数据层 ===================== */
let DATA = [];                 // 数组：论文（文件夹）
let VIEW = {mode:'global', paperId:null};

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ DATA = JSON.parse(raw).map(normalizePaper); return; }
    const v1 = localStorage.getItem(V1_KEY);
    if(v1){ DATA = JSON.parse(v1).map(migrateSub).map(normalizePaper); localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }
    else DATA = [];
  }catch(e){ DATA = []; }
}
// 规范化论文对象，保证字段齐全
function normalizePaper(p){
  p = p||{};
  p.id = p.id||uid();
  p.projectName = (p.projectName||'').trim() || p.title || '';   // 旧数据用论文标题作项目名
  p.title = p.title||'';
  p.titleEn = p.titleEn||'';
  // 作者：兼容旧版字符串 authors -> 结构化 authorList[{name,self,cofirst,corresponding}]
  if(Array.isArray(p.authorList)){ p.authorList = p.authorList.map(a=>{ a=a||{}; return {name:a.name||'', self:!!a.self, cofirst:!!a.cofirst, corresponding:!!a.corresponding}; }); }
  else if(p.authors){ p.authorList = String(p.authors).split(',').map(s=>s.trim()).filter(Boolean).map(n=>({name:n, self:false, cofirst:false, corresponding:false})); }
  else p.authorList = [];
  p.authors = (p.authorList||[]).map(a=>a.name).join(',');   // 向后兼容旧显示
  // 学科：兼容旧版单值 discipline -> 多值 disciplines
    if(Array.isArray(p.disciplines)){ p.disciplines = p.disciplines.map(String).map(discNorm).filter(Boolean); }
    else if(p.discipline){ p.disciplines = [String(p.discipline)].map(discNorm); }
    else p.disciplines = [];
  p.ddl = p.ddl||'';                                   // 工作中论文的截止日期
  // 顶层状态：完成 / 工作中（旧数据按是否有投稿记录推断）
  if(p.articleStatus!=='completed' && p.articleStatus!=='working'){
    p.articleStatus = (p.submissions&&p.submissions.length)?'completed':'working';
  }
  p.notes = p.notes||'';
  p.lang = (p.lang==='en'||p.lang==='both')?p.lang:'zh';
  p.submissions = (p.submissions||[]).map(s=>{ s=s||{}; s.type=s.type||''; s.timeline=s.timeline||[]; if(!s.id) s.id=uid();
    let arr = Array.isArray(s.levels) ? s.levels.slice() : (s.level ? [s.level] : (s.zone ? (inferLevel(s.zone)?[inferLevel(s.zone)]:[]) : []));
    arr = arr.filter(Boolean);
    s.levels = arr;
    if(s.zone===undefined) s.zone=''; return s; });
  return p;
}

// 旧版（单条投稿）记录 -> 论文文件夹
function migrateSub(s){
  const sub = {
    id: s.id||uid(), journal:s.journal||'', type:s.type||'', zone:s.zone||'', impactFactor:s.impactFactor||'',
    submitDate:s.submitDate||'', status:s.status||'submitted', round:s.round||'', deadline:s.deadline||'', note:s.note||'',
    timeline:s.timeline||[]
  };
  return {
    id: uid(), title:s.title||'未命名论文', titleEn:'', lang:'zh', authors:s.coauthors||'', notes:'',
    createdAt:s.createdAt||s.updatedAt||Date.now(), updatedAt:s.updatedAt||Date.now(),
    submissions:[sub]
  };
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
function fmtDate(s){ if(!s) return '—'; const d=new Date(s); if(isNaN(d)) return s; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function daysFromToday(s){ if(!s) return null; const t=new Date(); t.setHours(0,0,0,0); return daysBetween(t, s); }

// 语种切换时，先按「切换前语种」把已填标题暂存，再按「切换后语种」搬运，避免错归或丢失
let TL_BUF={zh:'',en:''};        // 新增表单标题缓冲（按语种暂存）
let TL_BUF_E={zh:'',en:''};      // 编辑表单标题缓冲
let F_LANG='zh', E_LANG='zh';    // 当前表单所选语种，用于判断切换方向
function applyLangSwitch(tId, teId, buf, wrapId, wrapEnId, newLang, prevLang){
  const wt=$('#'+wrapId), we=$('#'+wrapEnId); if(!wt) return;
  const tIn=$('#'+tId), eIn=$('#'+teId); if(!tIn) return;
  // 1) 先将当前输入框内容按「切换前语种」存回对应缓冲
  if(prevLang==='both'){ buf.zh=tIn.value; buf.en=eIn.value; }
  else if(prevLang==='en'){ buf.en=tIn.value; }
  else { buf.zh=tIn.value; }
  // 2) 再按「切换后语种」把对应缓冲搬到输入框
  if(newLang==='both'){
    wt.style.display=''; we.style.display=''; wt.querySelector('label').textContent=t('paperTitle')+'（'+t('zhOpt')+'）';
    tIn.value=buf.zh; if(eIn) eIn.value=buf.en;
  } else if(newLang==='en'){
    wt.style.display=''; we.style.display='none'; wt.querySelector('label').textContent=t('paperTitleEn');
    tIn.value=buf.en;
  } else {
    wt.style.display=''; we.style.display='none'; wt.querySelector('label').textContent=t('paperTitle');
    tIn.value=buf.zh;
  }
}
function toggleLang(v){ applyLangSwitch('f-title','f-titleEn',TL_BUF,'wrapTitle','wrapTitleEn',v,F_LANG); F_LANG=v; }

/* 当前状态：top-level 字段为权威，timeline 为历史记录 */
function currentEvent(sub){
  return {status:sub.status||'prep', round:sub.round||'', date:sub.submitDate||''};
}
/* 最终决定日期：取 timeline 最后一条的日期 */
function decisionDate(sub){
  const tl=(sub.timeline||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.ts||0)-(b.ts||0));
  const last=tl[tl.length-1];
  return (last&&last.date)||sub.submitDate||'';
}
/* 最近阶段日期：timeline 最后一条事件的实际日期，无进展记录则回退投稿日期 */
function lastStageDate(sub){
  const tl=(sub.timeline||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.ts||0)-(b.ts||0));
  const last=tl[tl.length-1];
  return (last&&last.date)||sub.submitDate||'';
}
/* 项目最近阶段日期：全部投稿取最大 */
function lastStageDateOfPaper(p){
  let best='';
  (p.submissions||[]).forEach(s=>{ const d=lastStageDate(s); if(d&&d>best) best=d; });
  return best;
}
/* 当前阶段：最近一条在审投稿及其阶段日期（卡片贴图与阶段时长排序同一口径） */
function currentStage(p){
  const pc=paperCurrent(p).status;
  if(pc!=='active'&&pc!=='revising') return null;
  const subs=(p.submissions||[]).filter(s=>ACTIVE_STATUS.includes(currentEvent(s).status));
  if(!subs.length) return null;
  subs.sort((a,b)=>(lastStageDate(b)||'').localeCompare(lastStageDate(a)||''));
  const s=subs[0]; const d=lastStageDate(s);
  if(!d) return null;
  return {sub:s, date:d};
}
/* 当前阶段持续天数：从阶段实际日期算到今天，无在审阶段返回 null */
function stageElapsedDays(p){
  const cs=currentStage(p); if(!cs) return null;
  const left=daysFromToday(cs.date); if(left===null) return null;
  return Math.max(0,-left);
}
/* 卡片阶段时长贴图（如 外审中 12天） */
function stageElapsedTag(p){
  const cs=currentStage(p); if(!cs) return '';
  const key=currentEvent(cs.sub).status;
  const color=(STATUS[key]||STATUS.prep).color;
  const n=stageElapsedDays(p);
  return `<span class="stage-tag" style="background:${color}1f;color:${color};border:1px solid ${color}66">&#9202; ${SLabel(key)} ${n}${t('statDays')}</span>`;
}
/* 当前投稿期刊及等级（与阶段贴图同一投稿口径），跟在时长贴图右侧 */
function currentJournalTag(p){
  const cs=currentStage(p); if(!cs) return '';
  const j=(cs.sub.journal||'').trim(); if(!j) return '';
  const lvl=subZoneLabel(cs.sub);
  return `<span class="stage-tag j-tag" title="${esc(j)}${lvl?' · '+esc(lvl):''}">&#128240; ${esc(j)}${lvl?` <b>${esc(lvl)}</b>`:''}</span>`;
}
/* 论文代表性状态 */
function paperCurrent(p){
  if(p.articleStatus==='working') return {status:'working'};
  const subs=(p.submissions||[]).map(currentEvent);
  if(!subs.length) return {status:'prep'};
  if(subs.some(c=>c.status==='accepted')) return {status:'accepted'};
  if(subs.some(c=>c.status==='major'||c.status==='minor')) return {status:'revising'};
  if(subs.some(c=>ACTIVE_STATUS.includes(c.status))) return {status:'active'};
  const all=subs.map(c=>c.status);
  if(all.every(s=>s==='rejected')) return {status:'rejected'};
  if(all.every(s=>s==='withdrawn')) return {status:'withdrawn'};
  if(all.every(s=>s==='prep')) return {status:'prep'};
  return {status:'rejected'};
}
function firstSubmit(p){ const ds=(p.submissions||[]).map(s=>s.submitDate).filter(Boolean).sort(); return ds[0]||''; }
function paperYear(p){ const fs=firstSubmit(p); if(fs) return new Date(fs).getFullYear(); return new Date(p.createdAt||Date.now()).getFullYear(); }
// 学科领域：文本框输入匹配（中英双语）+ 可新增（类似报名链接下拉）
let TMP_DISC=[];
// 候选列表：JCR 学科 + 已选的自定义项
function discCandidates(){
  const list = DISCIPLINE_LIST.map(d=>({zh:d.zh, en:d.en, label: d.zh ? `${d.zh}（${d.en}）` : d.en}));
  TMP_DISC.forEach(zh=>{ if(!DISC_ZH2EN[zh] && !list.some(x=>x.zh===zh)) list.push({zh, en:'', label:zh}); });
  return list;
}
// 已选学科标签（可移除）
function renderDiscSel(){
  const box=$('#discSel'); if(!box) return;
  box.innerHTML = TMP_DISC.map(zh=>`<span class="disc-sel">${esc(discLabel(zh))}<button type="button" class="x" onclick="discRemove('${esc(zh)}')" title="移除">×</button></span>`).join('');
}
// 输入时实时过滤下拉
function discFilter(){
  const inp=$('#discInput'), menu=$('#discMenu'); if(!inp||!menu) return;
  const q=inp.value.trim().toLowerCase();
  menu.style.display='block';
  let cands = discCandidates();
  if(q) cands = cands.filter(c=> (c.en&&c.en.toLowerCase().includes(q)) || (c.zh&&c.zh.toLowerCase().includes(q)) );
  // 已选的排前面，便于取消
  cands.sort((a,b)=> (TMP_DISC.includes(b.zh)?1:0)-(TMP_DISC.includes(a.zh)?1:0));
  const exact = cands.some(c=> c.zh.toLowerCase()===q || c.en.toLowerCase()===q);
  let html = cands.map(c=>{
    const on=TMP_DISC.includes(c.zh);
    return `<div class="combo-item ${on?'on':''}" data-zh="${esc(c.zh)}" onclick="discPickEl(this)">${esc(c.label)}${on?' <span class="tick">✓</span>':''}</div>`;
  }).join('');
  if(q && !exact) html += `<div class="combo-add" onclick="discAddNew()">＋ 新增「${esc(inp.value.trim())}」</div>`;
  if(!html) html = `<div class="combo-empty">无匹配，可点击上方「新增」</div>`;
  menu.innerHTML = html;
}
function discPickEl(el){ discPick(el.dataset.zh); }
function discPick(zh){
  if(TMP_DISC.includes(zh)) TMP_DISC=TMP_DISC.filter(x=>x!==zh);
  else TMP_DISC.push(zh);
  const inp=$('#discInput'); if(inp) inp.value='';   // 选中后清空搜索框，避免残留搜索词
  renderDiscSel(); discFilter();
  if(inp) inp.focus();
}
// 回车：精确匹配则选中，否则新增
function discEnter(){
  const inp=$('#discInput'); const q=inp.value.trim(); if(!q) return;
  const c=discCandidates().find(x=> x.zh.toLowerCase()===q.toLowerCase() || (x.en&&x.en.toLowerCase()===q.toLowerCase()));
  if(c){ if(!TMP_DISC.includes(c.zh)) TMP_DISC.push(c.zh); }
  else { if(!TMP_DISC.includes(q)) TMP_DISC.push(q); }
  inp.value=''; renderDiscSel(); discFilter();
}
function discAddNew(){
  const inp=$('#discInput'); const v=inp.value.trim(); if(!v) return;
  if(!TMP_DISC.includes(v)) TMP_DISC.push(v);
  inp.value=''; renderDiscSel(); discFilter();
}
function discRemove(zh){ TMP_DISC=TMP_DISC.filter(x=>x!==zh); renderDiscSel(); discFilter(); }
// 点击下拉之外区域关闭菜单
document.addEventListener('click', function(e){
  const c=document.getElementById('discCombo');
  if(c && !c.contains(e.target)){ const m=document.getElementById('discMenu'); if(m) m.style.display='none'; }
});
// 所有出现过的学科（用于筛选下拉）
function allDisciplines(){
  const set=[];
  DISCIPLINE_LIST.forEach(d=>{ if(!set.includes(d.zh)) set.push(d.zh); });
  DATA.forEach(p=>{ (p.disciplines||[]).forEach(d=>{ if(!set.includes(d)) set.push(d); }); });
  return set;
}
function earliestDeadline(p){
  let best=null;
  (p.submissions||[]).forEach(s=>{ if(!s.deadline||FINAL_STATUS.includes(currentEvent(s).status)) return; if(!best||s.deadline<best) best=s.deadline; });
  return best;
}

// 记忆的合作者（输入过的姓名会被保存为选项）
function rememberedAuthors(){ try{ return JSON.parse(localStorage.getItem(AUTHORS_MEM_KEY)||'[]'); }catch(e){ return []; } }
function rememberAuthor(name){ name=(name||'').trim(); if(!name) return; const a=rememberedAuthors(); if(!a.includes(name)){ a.push(name); localStorage.setItem(AUTHORS_MEM_KEY, JSON.stringify(a)); } }
// 临时编辑列表（弹窗内使用）
let TMP_AUTHORS=[];
let DRAG_AUTHOR_IDX=null;
function authorList(p){ return (p&&p.authorList)||[]; }
// 根据列表顺序计算每位作者的位次标签（支持共同第一作者）
function authorLabels(list){
  const cofirst=list.filter(a=>a.cofirst);
  const hasCofirst=cofirst.length>0;
  let nonCo=0;
  return list.map(a=>{
    if(a.cofirst){ return `共一第${cofirst.indexOf(a)+1}作者`; }
    nonCo++;
    return `第${(hasCofirst?1:0)+nonCo}作者`;
  });
}
function authorNames(p){ return authorList(p).map(a=>a.name).join('、'); }
// 文件夹头部 / 详情展示用（含共一 / 通讯 标签）
function authorChipsHTML(p){
  const list=authorList(p); if(!list.length) return '';
  const labels=authorLabels(list);
  return '<div class="author-chips-inline">'+list.map((a,i)=>{
    const tags=[];
    if(a.cofirst) tags.push(`<span class="badge" style="background:#fef3c7;color:#92400e">共一</span>`);
    if(a.corresponding) tags.push(`<span class="badge" style="background:#dbeafe;color:#1e40af">通讯</span>`);
    return `<span class="author-chip"><b>${esc(a.name)}</b> <span class="a-role">${labels[i]}</span> ${tags.join('')}</span>`;
  }).join('')+'</div>';
}
// 导出用：姓名(标签,位次)
function authorsExport(p){
  const list=authorList(p); if(!list.length) return '';
  const labels=authorLabels(list);
  return list.map((a,i)=>{ const tags=[]; if(a.cofirst)tags.push('共一'); if(a.corresponding)tags.push('通讯');
    return a.name+(tags.length?`(${tags.join('/')},${labels[i]})`:`(${labels[i]})`); }).join('；');
}
// 卡片内紧凑展示（每位作者的姓名后紧跟其共一 / 通讯 标记）
function authorLineHTML(p){
  const list=authorList(p); if(!list.length) return '';
  const labels=authorLabels(list);
  const parts=list.map((a,i)=>{
    const tags=[];
    if(a.cofirst) tags.push(`<span class="badge" style="background:#fef3c7;color:#92400e">共一</span>`);
    if(a.corresponding) tags.push(`<span class="badge" style="background:#dbeafe;color:#1e40af">通讯</span>`);
    return `<b>${esc(a.name)}</b>${tags.length?' '+tags.join(''):''}`;
  });
  return `<span>&#128101; ${parts.join('、')}</span>`;
}
// 表单内渲染作者 chips（支持拖拽改顺序）
function renderAuthorChips(){
  const box=$('#authorBox'); if(!box) return;
  if(!TMP_AUTHORS.length){ box.innerHTML='<div style="color:var(--sub);font-size:12.5px;padding:4px 0">'+t('noAuthorYet')+'</div>'; return; }
  const labels=authorLabels(TMP_AUTHORS);
  box.innerHTML=TMP_AUTHORS.map((a,i)=>`
    <div class="author-chip edit" draggable="true" data-i="${i}"
      ondragstart="DRAG_AUTHOR_IDX=${i}"
      ondragover="event.preventDefault(); if(DRAG_AUTHOR_IDX!==${i}) this.classList.add('drag-over')"
      ondragleave="this.classList.remove('drag-over')"
      ondrop="event.preventDefault(); this.classList.remove('drag-over'); dropAuthor(${i})"
      ondragend="DRAG_AUTHOR_IDX=null; document.querySelectorAll('.author-chip.edit.drag-over').forEach(e=>e.classList.remove('drag-over'))">
      <span class="drag-grip" title="拖拽调整位次">&#8942;&#8942;</span>
      <span class="a-name" title="点击编辑姓名" onclick="editAuthorName(${i})"><b>${esc(a.name)}</b> <span class="a-role">${labels[i]}</span> <span class="a-edit-pen" title="编辑">&#9998;</span></span>
      <span class="a-flags">
        <button type="button" class="a-flag ${a.cofirst?'on':''}" onclick="toggleAuthorFlag(${i},'cofirst')">共一</button>
        <button type="button" class="a-flag ${a.corresponding?'on':''}" onclick="toggleAuthorFlag(${i},'corresponding')">通讯</button>
        <button type="button" class="a-del" onclick="removeAuthor(${i})" title="删除">×</button>
      </span>
    </div>`).join('');
}
function dropAuthor(target){
  if(DRAG_AUTHOR_IDX===null||DRAG_AUTHOR_IDX===target) return;
  const [m]=TMP_AUTHORS.splice(DRAG_AUTHOR_IDX,1);
  TMP_AUTHORS.splice(target,0,m);
  DRAG_AUTHOR_IDX=null; renderAuthorChips();
}
function toggleAuthorFlag(i,flag){
  if(!TMP_AUTHORS[i]) return;
  if(flag==='self'){
    if(TMP_AUTHORS[i].self){ TMP_AUTHORS[i].self=false; }
    else { TMP_AUTHORS.forEach(a=>a.self=false); TMP_AUTHORS[i].self=true; }
  } else { TMP_AUTHORS[i][flag]=!TMP_AUTHORS[i][flag]; }
  renderAuthorChips();
}
function removeAuthor(i){ TMP_AUTHORS.splice(i,1); renderAuthorChips(); }
// 行内编辑作者姓名
let AE_CANCEL=false;
function editAuthorName(i){
  const chip=document.querySelector('.author-chip.edit[data-i="'+i+'"]'); if(!chip) return;
  const nm=chip.querySelector('.a-name'); if(!nm) return;
  const cur=TMP_AUTHORS[i].name;
  AE_CANCEL=false;
  nm.innerHTML=`<span class="ae-edit"><input class="author-edit-input" value="${esc(cur)}" onkeydown="if(event.key==='Enter'){this.blur();}else if(event.key==='Escape'){AE_CANCEL=true;renderAuthorChips();}" onblur="if(!AE_CANCEL)commitAuthorName(${i},this.value)"><button class="ae-btn" type="button" title="保存" onclick="this.closest('.ae-edit').querySelector('input').blur()">✓</button><button class="ae-btn ae-x" type="button" title="取消" onclick="AE_CANCEL=true;renderAuthorChips()">✕</button></span>`;
  const inp=nm.querySelector('input'); if(inp){ inp.focus(); inp.select(); }
}
function commitAuthorName(i,val){
  val=(val||'').trim();
  if(!val){ renderAuthorChips(); return; }
  if(TMP_AUTHORS.some((a,idx)=>idx!==i && a.name===val)){ toast(t('existAuthor')); renderAuthorChips(); return; }
  TMP_AUTHORS[i].name=val; rememberAuthor(val); renderAuthorChips();
}
function addAuthor(){
  const inp=$('#authorInput'); if(!inp) return;
  const v=inp.value.trim(); if(!v) return;
  if(TMP_AUTHORS.some(a=>a.name===v)){ toast(t('dupAuthor')); inp.value=''; return; }
  TMP_AUTHORS.push({name:v, self:false, cofirst:false, corresponding:false});
  rememberAuthor(v); inp.value=''; renderAuthorChips();
}
function addSelfAuthor(){
  let name=getSelfName();
  if(!name){ name=prompt(t('inputSelfName')); if(!name) return; name=name.trim(); if(!name) return; setSelfName(name); }
  if(TMP_AUTHORS.some(a=>a.self)){ toast(t('selfAdded')); return; }
  if(TMP_AUTHORS.some(a=>a.name===name)){ const idx=TMP_AUTHORS.findIndex(a=>a.name===name); TMP_AUTHORS[idx].self=true; renderAuthorChips(); return; }
  TMP_AUTHORS.unshift({name, self:true, cofirst:false, corresponding:false});
  rememberAuthor(name); renderAuthorChips();
}
function fillAuthorMem(){ const dl=$('#authorMem'); if(dl) dl.innerHTML=rememberedAuthors().map(n=>`<option value="${esc(n)}">`).join(''); }

/* ===================== 统计 ===================== */
function allSubs(){ return DATA.flatMap(p=>p.submissions||[]); }

function renderStatsGlobal(){
  const subs=allSubs();
  const total=subs.length;
  // 修改中（大修/小修）单独统计，不计入在审中
  const revising=subs.filter(s=>{const c=currentEvent(s).status; return c==='major'||c==='minor';}).length;
  const active=subs.filter(s=>{const c=currentEvent(s).status; return c==='submitted'||c==='review';}).length;
  const accepted=subs.filter(s=>currentEvent(s).status==='accepted').length;
  const rejected=subs.filter(s=>currentEvent(s).status==='rejected').length;
  const decided=accepted+rejected;
  const hitRate=decided?Math.round(accepted/decided*100):0;
  let durs=[];
  subs.forEach(s=>{ const c=currentEvent(s); if(FINAL_STATUS.includes(c.status)&&s.submitDate){ const dd=decisionDate(s); if(dd){ const d=daysBetween(s.submitDate,dd); if(d>=0) durs.push(d);} } });
  const avgDur=durs.length?Math.round(durs.reduce((a,b)=>a+b,0)/durs.length):0;

  const cards=[
    {k:t('statPapers'), v:DATA.length, dot:'var(--brand)'},
    {k:t('statWorking'), v:DATA.filter(p=>p.articleStatus==='working').length, dot:'var(--amber)'},
    {k:t('statSubs'), v:total, dot:'var(--blue)'},
    {k:t('statActive'), v:active, dot:'var(--purple)'},
    {k:t('statRevising'), v:revising, dot:'var(--orange)'},
    {k:t('statAccepted'), v:accepted, dot:'var(--green)'},
    {k:t('statHitRate'), v:hitRate, unit:'%', sub:`${accepted}/${decided||0} ${t('statDecided')}`, dot:'var(--amber)'},
    {k:t('statAvgDur'), v:avgDur||'—', unit:avgDur?t('statDays'):'', dot:'var(--teal)'},
  ];
  $('#statGrid').innerHTML=cards.map(c=>`
    <div class="stat">
      <div class="k"><span class="dot" style="background:${c.dot}"></span>${c.k}</div>
      <div class="v">${c.v}${c.unit?`<small>${c.unit}</small>`:''}${c.sub?`<small>${c.sub}</small>`:''}</div>
    </div>`).join('');

  renderDonut(subs,'#donut'); renderBars(subs,'#bars');
  const acceptedSubs = subs.filter(s=>currentEvent(s).status==='accepted');
  renderBars(acceptedSubs,'#barsAccepted');
  renderJournalStats();
}

/* 投稿期刊 TOP 5 统计（柱状图：投稿次数 + 命中次数） */
let journalStatsSort = 'count';   // 'count' | 'rate'
function renderJournalStats(){
  const subs = allSubs();
  const stats = {};   // journal -> {count, accepted, levelRank, impact}
  subs.forEach(s=>{
    const j = (s.journal||'').trim() || t('jUnknownJournal');
    if(!stats[j]) stats[j] = {count:0, accepted:0, levelRank:0, impact:0};
    const st = stats[j];
    st.count++;
    if(currentEvent(s).status === 'accepted') st.accepted++;
    // 分区优先级：取该期刊全部投稿中的最高等级 rank（保留最大值）
    const r = LEVEL_RANK[bestLevelKey(s)] || 0;
    if(r > st.levelRank) st.levelRank = r;
    // 影响因子：取该期刊全部投稿中的最高 IF
    const f = parseFloat(s.impactFactor);
    if(!isNaN(f) && f > st.impact) st.impact = f;
  });
  let arr = Object.keys(stats).map(j=>({
    journal:j, count:stats[j].count, accepted:stats[j].accepted,
    rate: stats[j].count ? Math.round(stats[j].accepted/stats[j].count*100) : 0,
    levelRank: stats[j].levelRank, impact: stats[j].impact
  }));
  // 排序：投稿次数相同 -> 先按分区优先级(高者前)，再按影响因子(高者前)
  if(journalStatsSort === 'rate'){
    arr.sort((a,b)=> b.rate - a.rate || b.count - a.count || b.levelRank - a.levelRank || b.impact - a.impact);
  } else {
    arr.sort((a,b)=> b.count - a.count || b.levelRank - a.levelRank || b.impact - a.impact);
  }
  const top5 = arr.slice(0, 5);
  const box = $('#journalStats');
  if(!top5.length){ box.innerHTML='<div class="empty" style="padding:30px"><div class="ic">&#128202;</div><div>'+t('jEmpty')+'</div></div>'; return; }
  const maxCount = Math.max(...top5.map(x=>x.count));
  box.innerHTML =
    '<div class="legend" style="margin-bottom:9px"><span><span class="dot" style="background:var(--blue)"></span>'+t('jLegendCount')+'</span><span><span class="dot" style="background:var(--green)"></span>'+t('jLegendAccepted')+'</span></div>'
    + top5.map(x=>{
      const wCount = Math.round(x.count / maxCount * 100);
      const wAccepted = Math.round(x.accepted / maxCount * 100);
      return `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72%">${esc(x.journal)}</span>
          <span style="font-size:11px;color:var(--sub);flex-shrink:0">${t('statHitRate')} <b style="color:${x.rate>=50?'var(--green)':'var(--amber)'}">${x.rate}%</b></span>
        </div>
        <div style="display:flex;gap:6px;align-items:center;margin-bottom:3px">
          <div style="width:38px;font-size:11px;color:var(--sub);text-align:right;flex-shrink:0">${t('jLabelCount')}</div>
          <div style="flex:1;background:#f1f5f9;border-radius:6px;overflow:hidden;height:16px">
            <div style="width:${wCount}%;height:100%;background:var(--blue);border-radius:6px;transition:width .4s"></div>
          </div>
          <div style="width:22px;font-weight:650;font-size:12px;text-align:center">${x.count}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <div style="width:38px;font-size:11px;color:var(--sub);text-align:right;flex-shrink:0">${t('jLabelHit')}</div>
          <div style="flex:1;background:#f1f5f9;border-radius:6px;overflow:hidden;height:16px">
            <div style="width:${wAccepted}%;height:100%;background:var(--green);border-radius:6px;transition:width .4s"></div>
          </div>
          <div style="width:22px;font-weight:650;font-size:12px;text-align:center">${x.accepted}</div>
        </div>
      </div>`;
    }).join('');
}

/* 环形图：状态分布（原生SVG，离线可用） */
function renderDonut(subs, sel){
  const counts={}; STATUS_ORDER.forEach(k=>counts[k]=0);
  subs.forEach(s=>{ counts[currentEvent(s).status]++; });
  const items=STATUS_ORDER.filter(k=>counts[k]>0).map(k=>({k,label:SL(k),color:STATUS[k].color,val:counts[k]}));
  const total=items.reduce((a,b)=>a+b.val,0);
  const box=$(sel);
  if(!total){ box.innerHTML='<div class="empty" style="padding:30px"><div class="ic">&#128203;</div><div>'+t('chartEmpty')+'</div></div>'; return; }
  const cx=90,cy=90,r=68,sw=26; let ang=-Math.PI/2; const C=2*Math.PI*r;
  let segs='';
  items.forEach(it=>{
    const frac=it.val/total; const len=frac*C;
    segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.color}" stroke-width="${sw}"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-(ang+Math.PI/2)/(2*Math.PI)*C}" transform="rotate(-90 ${cx} ${cy})"><title>${it.label}: ${it.val}</title></circle>`;
    ang+=frac*2*Math.PI;
  });
  box.innerHTML=`<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <svg width="180" height="180" viewBox="0 0 180 180" style="flex-shrink:0">
      ${segs}
      <text x="90" y="84" text-anchor="middle" font-size="30" font-weight="700" fill="var(--ink)">${total}</text>
      <text x="90" y="106" text-anchor="middle" font-size="12" fill="var(--sub)">${t('donutUnit')}</text>
    </svg>
    <div class="legend" style="flex-direction:column;gap:7px">
      ${items.map(it=>`<span><span class="dot" style="background:${it.color}"></span>${it.label} <b style="color:var(--ink);margin-left:2px">${it.val}</b></span>`).join('')}
    </div></div>`;
}

/* 柱状图：期刊等级分布 */
function renderBars(subs, sel){
  const counts={};
  subs.forEach(s=>{ const z=subZoneLabel(s)||t('unknownDisc'); counts[z]=(counts[z]||0)+1; });
  // 排序：按 JLEVELS 标准顺序，其余（含自定义）其次，未分类最后
  const ord=k=>{ const i=JLEVELS.findIndex(l=>l.label===k); if(i>=0) return i; if(k===t('unknownDisc')) return 999; return 500; };
  const keys=Object.keys(counts).sort((a,b)=> ord(a)-ord(b) || counts[b]-counts[a]);
  const box=$(sel);
  if(!keys.length){ box.innerHTML='<div class="empty" style="padding:30px"><div class="ic">&#127942;</div><div>'+t('chartEmpty')+'</div></div>'; return; }
  const max=Math.max(...keys.map(k=>counts[k]));
  box.innerHTML=keys.map(k=>{ const w=Math.round(counts[k]/max*100); const col=(JLEVELS.find(l=>l.label===k)||{}).color||'#94a3b8';
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
      <div style="width:78px;font-size:12.5px;color:var(--sub);text-align:right;flex-shrink:0">${esc(k)}</div>
      <div style="flex:1;background:#f1f5f9;border-radius:6px;overflow:hidden;height:22px">
        <div style="width:${w}%;height:100%;background:${col};border-radius:6px;transition:width .4s"></div>
      </div>
      <div style="width:26px;font-weight:650;font-size:13px">${counts[k]}</div>
    </div>`; }).join('');
}

function deadlineTag(sub){
  const c=currentEvent(sub);
  if(FINAL_STATUS.includes(c.status)||!sub.deadline) return '';
  const d=daysFromToday(sub.deadline);
  if(d===null) return '';
  if(d<0) return `<span class="deadline-tag dl-over">&#9888; 已逾期 ${-d} 天（${fmtDate(sub.deadline)}）</span>`;
  if(d<=7) return `<span class="deadline-tag dl-soon">&#9203; ${d===0?'今天截止':`还剩 ${d} 天`}（${fmtDate(sub.deadline)}）</span>`;
  return `<span class="deadline-tag dl-ok">截止 ${fmtDate(sub.deadline)}（${d}天）</span>`;
}
function buildTimeline(paperId, s){

/* ===== 全局：论文列表 ===== */
let collapsedGroups=new Set();
function renderGlobal(){
  document.getElementById('paperOnly').style.display='none';
  document.getElementById('globalOnly').style.display='block';
  renderStatsGlobal();
  populateFilters();
  const q=$('#search').value.trim().toLowerCase();
  const fa=$('#filterAuthor').value;
  const fs=$('#filterStatus').value;
  const fd=$('#filterDiscipline').value;
  const fy=$('#filterYear').value;
  const groupBy=$('#groupBy').value;
  const sortBy=$('#sortBy').value;
  let papers=DATA.slice();
  if(q){ papers=papers.filter(p=>{
    const hay=`${p.projectName} ${p.title} ${p.titleEn} ${authorNames(p)} ${(p.disciplines||[]).join(' ')} ${(p.submissions||[]).map(s=>s.journal+' '+subLevelsText(s)).join(' ')}`.toLowerCase();
    return hay.includes(q);
  }); }
  if(fa){ papers=papers.filter(p=>(p.authorList||[]).some(a=>a.name===fa)); }
  if(fs){ papers=papers.filter(p=>{
    const pc=paperCurrent(p).status;
    if(fs==='working') return pc==='working';
    if(fs==='revising') return pc==='revising';
    if(['accepted','rejected','withdrawn','prep'].includes(fs)) return pc===fs;
    if(ACTIVE_STATUS.includes(fs)) return pc==='active'&&(p.submissions||[]).some(s=>currentEvent(s).status===fs);
    return true;
  }); }
  if(fd){ papers=papers.filter(p=>(p.disciplines||[]).includes(fd)); }
  if(fy){ papers=papers.filter(p=>String(paperYear(p))===fy); }
  papers.sort((a,b)=>{
    // 任何排序方式下，工作中项目都强制置顶（与所选排序无关）
    const wa=a.articleStatus==='working'?0:1, wb=b.articleStatus==='working'?0:1;
    if(wa!==wb) return wa-wb;
    // 组内再按所选排序方式排列
    if(sortBy==='title') return projNameText(a).localeCompare(projNameText(b),'zh');
    if(sortBy==='submit') return (firstSubmit(b)||'').localeCompare(firstSubmit(a)||'');
    // 按阶段时长：修改中最上（时长长在前），外审中其次（时长短在前），已接收在已拒稿前，其余按更新时间置后
    if(sortBy==='stage'){
      const rank=p=>{const pc=paperCurrent(p).status; if(pc==='revising')return 0; if(pc==='active')return 1; if(pc==='accepted')return 2; if(pc==='rejected')return 3; return 4;};
      const ra=rank(a), rb=rank(b);
      if(ra!==rb) return ra-rb;
      if(ra===0){ const na=stageElapsedDays(a), nb=stageElapsedDays(b); if(na!==nb) return nb-na; }
      if(ra===1){ const na=stageElapsedDays(a), nb=stageElapsedDays(b); if(na!==nb) return na-nb; }
      return (b.updatedAt||0)-(a.updatedAt||0);
    }
    // 按最近阶段：用各投稿最近进展记录的实际日期，不用手动更新时间
    const da=lastStageDateOfPaper(a), db=lastStageDateOfPaper(b);
    if(da||db) return (db||'').localeCompare(da||'');
    return (b.updatedAt||0)-(a.updatedAt||0);
  });
  const list=$('#list');
  if(!DATA.length){ list.innerHTML=empty(t('emptyNoProject'),t('emptyNoProjectSub')); return; }
  if(!papers.length){ list.innerHTML=empty(t('emptyNoMatch')); return; }
  if(groupBy==='none'){ list.innerHTML=papers.map(cardHTML).join(''); return; }
  const groups={};
  papers.forEach(p=>{ groupKeys(p,groupBy).forEach(k=>{ (groups[k]=groups[k]||[]).push(p); }); });
  const gk=Object.keys(groups).sort((a,b)=> groupBy==='year'?b.localeCompare(a):a.localeCompare(b,'zh'));
  list.innerHTML=gk.map(k=>{
    const collapsed=collapsedGroups.has(k);
    return `<div class="group-head ${collapsed?'collapsed':''}" onclick="toggleGroup(this,'${esc(k)}')">
        <span class="g-caret">&#9662;</span><span>${esc(k)}</span>
        <span class="g-count">${(groups[k]||[]).length}</span>
      </div>
      <div class="group-body">${groups[k].map(cardHTML).join('')}</div>`;
  }).join('');
}
function groupKeys(p,by){
  if(by==='year') return [paperYear(p)+t('groupYearSuffix')];
  if(by==='status') return [SL(paperCurrent(p).status)];
  if(by==='discipline'){ const ds=p.disciplines||[]; return ds.length?ds:[t('unknownDisc')]; }
  if(by==='author'){ const ns=(p.authorList||[]).map(a=>a.name).filter(Boolean); return ns.length?ns:[t('noAuthor')]; }

function deadlineTagFromDate(d){
  const dd=daysFromToday(d);
  if(dd<0) return `<span class="deadline-tag dl-over">&#9888; ${esc(d)} 逾期 ${-dd} 天</span>`;
  if(dd<=7) return `<span class="deadline-tag dl-soon">&#9203; ${d} ${dd===0?'今天截止':`剩 ${dd} 天`}</span>`;
  return `<span class="deadline-tag dl-ok">${d}（${dd}天）</span>`;
}

let GLOBAL_SCROLL=0, FROM_PAPER=false;
function openPaper(id){
  GLOBAL_SCROLL = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
  FROM_PAPER=true; VIEW={mode:'paper',paperId:id}; renderPaper();
}
function goGlobal(){
  const fromPaper=FROM_PAPER; FROM_PAPER=false;
  VIEW={mode:'global',paperId:null}; renderGlobal();
  if(fromPaper) window.scrollTo(0, GLOBAL_SCROLL);   // 恢复到进入文件夹前的滚动位置，避免返回主页跳到顶部
}

function renderPaper(){
  const p=DATA.find(x=>x.id===VIEW.paperId);
  if(!p){ goGlobal(); return; }
  document.getElementById('globalOnly').style.display='none';
  document.getElementById('paperOnly').style.display='block';
  const subs=p.submissions||[];
  const pc=paperCurrent(p).status;
  $('#pTitle').innerHTML=esc(projNameText(p))+showLangBadge(p);
  const bt=paperBilingualText(p);
  $('#pSubTitle').innerHTML=(bt && bt!==(p.projectName||'').trim())?`<span style="color:var(--sub);font-size:13px">论文标题：${esc(bt)}</span>`:'';
  $('#pAuthors').innerHTML=authorChipsHTML(p)+' '+(p.disciplines||[]).map(d=>`<span class="badge" style="background:#ecfdf5;color:#047857">&#128218; ${esc(discLabel(d))}</span>`).join(' ');
  $('#pNotes').className='paper-notes'+(p.notes?'':' empty');
  $('#pNotes').innerHTML=p.notes?esc(p.notes):t('noNotes');

  const accepted=subs.filter(s=>currentEvent(s).status==='accepted').length;
  const rejected=subs.filter(s=>currentEvent(s).status==='rejected').length;
  const active=subs.filter(s=>ACTIVE_STATUS.includes(currentEvent(s).status)).length;
  const decided=accepted+rejected;
  const hitRate=decided?Math.round(accepted/decided*100):0;
  let durs=[]; subs.forEach(s=>{ const c=currentEvent(s); if(FINAL_STATUS.includes(c.status)&&s.submitDate){ const dd=decisionDate(s); if(dd){ const d=daysBetween(s.submitDate,dd); if(d>=0) durs.push(d);} } });
  const avgDur=durs.length?Math.round(durs.reduce((a,b)=>a+b,0)/durs.length):0;
  const cards=[
    {k:t('curStatus'), v:SL(pc), dot:PAPER_STATUS[pc].color, nowrap:true},
    {k:t('statSubs'), v:subs.length, dot:'var(--brand)'},
    {k:t('statHitRate'), v:hitRate, unit:'%', sub:`${accepted}/${decided||0} ${t('statDecided')}`, dot:'var(--amber)'},
    {k:t('statAvgDur'), v:avgDur||'—', unit:avgDur?t('statDays'):'', dot:'var(--teal)'},
    {k:t('statRejected')||'被拒次数', v:rejected, dot:'var(--red)'},
    {k:t('ddlFirst'), v:fmtDate(firstSubmit(p)), nowrap:true, dot:'var(--blue)'},
  ];
  $('#pStats').innerHTML=cards.map(c=>`
    <div class="stat">
      <div class="k"><span class="dot" style="background:${c.dot}"></span>${c.k}</div>
      <div class="v" style="${c.nowrap?'font-size:19px':''}">${c.v}${c.unit?`<small>${c.unit}</small>`:''}${c.sub?`<small>${c.sub}</small>`:''}</div>
    </div>`).join('');

  const charts=$('#paperCharts');

  // 工作中：只展示截止日期，不显示投稿区
  if(p.articleStatus==='working'){
    newBtn.style.display='none';
    const ddlTxt=p.ddl?(`${t('ddlDeadline')}：<b>${fmtDate(p.ddl)}</b> ｜ ${deadlineTagFromDate(p.ddl)}`):t('workNoDdl');
    charts.innerHTML=`<div class="work-panel">

  newBtn.style.display='';
  charts.innerHTML=`<div class="card chart-card"><h3>&#128202; ${t('paperStatusDist')}</h3><div id="pDonut"></div></div>
    <div class="card chart-card"><h3>&#128260; ${t('paperHistory')}</h3><div id="pHistory" style="font-size:13px;color:var(--sub)"></div></div>`;
  renderDonut(subs,'#pDonut');

  $('#pHistory').innerHTML = hist.length? hist.map(s=>{
    const st=STATUS[currentEvent(s).status]||STATUS.prep;
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)">
      <span class="dot" style="background:${st.color}"></span>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.journal)||t('journal')}</span>
      <span style="font-size:12px;color:var(--sub)">${fmtDate(s.submitDate)}</span>

    </div>`; }).join('') : '<div style="color:var(--sub);padding:8px 0">'+t('emptyNoSub')+'</div>';

  if(!subs.length){ list.innerHTML=empty(t('emptyNoSub'),t('emptyNoSubSub')); return; }
  list.innerHTML=subs.map(s=>{
    const c=currentEvent(s); const st=STATUS[c.status]||STATUS.prep;
    return `<div class="sub s-${st.cls}" data-id="${s.id}">
      <div class="sub-head">
        <div style="flex:1;min-width:0">
          <p class="sub-title">&#128214; ${esc(s.journal)||t('journal')}</p>
          <div class="journal-line">
            ${subZoneBadge(s)}
            ${s.impactFactor?`<span class="badge b-if">IF ${esc(s.impactFactor)}</span>`:''}
            ${s.type?`<span class="badge" style="background:#f1f5f9;color:#475569">${esc(s.type)}</span>`:''}
          </div>
        </div>
        <div style="text-align:right">${statusBadge(c.status,c.round)}</div>
      </div>
      <div class="meta">
        <span>&#128197; ${t('submitDate')}：<b>${fmtDate(s.submitDate)}</b></span>
        ${deadlineTag(s)}
      </div>
      <div class="timeline" id="tl-${s.id}">${buildTimeline(p.id, s)}</div>
      <div class="sub-actions">
        <button class="btn sm ghost" onclick="toggleTL('${s.id}')">&#128200; ${t('progress')} (${(s.timeline||[]).length})</button>
        <button class="btn sm primary" onclick="openProgress('${p.id}','${s.id}')">&#43; ${t('progress')}</button>
        <button class="btn sm" onclick="openEditSub('${p.id}','${s.id}')">&#9998; ${t('edit')}</button>

}

function delPaper(id){
  const p=DATA.find(x=>x.id===id); if(!p) return;
  if(!confirm(t('delPaperConfirm', p.title||t('emptyNoProject'), p.submissions?.length||0))) return;
  DATA=DATA.filter(x=>x.id!==id); save(); goGlobal(); toast(t('delPaperOk'));
}
function delSub(paperId,subId){
  const p=DATA.find(x=>x.id===paperId); if(!p) return;
  const s=p.submissions.find(x=>x.id===subId); if(!s) return;
  if(!confirm(t('delSubConfirm', p.title, s.journal||t('journal')))) return;
  p.submissions=p.submissions.filter(x=>x.id!==subId);
  p.updatedAt=Date.now(); save(); renderPaper(); toast(t('delSubOk'));
}

  const p=DATA.find(x=>x.id===paperId); if(!p) return;

  else { s.status='prep'; s.round=''; }

/* ===================== 期刊等级体系 ===================== */
// 期刊等级（按族分组显示：JCR > CSSCI 三档 > CSCD > CCF > 北大核心 > EI > Scopus > 中英文普刊；优先级见 LEVEL_RANK，原等级排序不变）
const JLEVELS = [
  {key:'jcr1',         label:'JCR Q1',     color:'#dc2626'},
  {key:'jcr2',         label:'JCR Q2',     color:'#ea580c'},
  {key:'jcr3',         label:'JCR Q3',     color:'#d97706'},
  {key:'jcr4',         label:'JCR Q4',     color:'#ca8a04'},
  {key:'cssci',        label:'CSSCI',      color:'#2563eb'},
  {key:'cssci_ext',    label:'CSSCI扩展版',color:'#3b82f6'},
  {key:'cssci_series', label:'CSSCI集刊', color:'#60a5fa'},
  {key:'cscd',         label:'CSCD',       color:'#0891b2'},
  {key:'ccf_a',        label:'CCF-A',      color:'#be123c'},
  {key:'ccf_b',        label:'CCF-B',      color:'#db2777'},
  {key:'ccf_c',        label:'CCF-C',      color:'#e879a8'},
  {key:'pku',          label:'北大核心',   color:'#7c3aed'},
  {key:'ei',           label:'EI',         color:'#0e7490'},
  {key:'scopus',       label:'Scopus',     color:'#0d9488'},
  {key:'ordinary',     label:'中英文普刊', color:'#94a3b8'},
];
// 显示优先级（数值越大越优先；本次仅新增 ei，已有等级数值保持不变）
const LEVEL_RANK = {jcr1:14,jcr2:13,jcr3:12,jcr4:11,cssci:10,cscd:9,cssci_ext:8,cssci_series:7,ccf_a:6,pku:5,ccf_b:4,ei:3.5,scopus:3,ccf_c:2,ordinary:1};
function levelMeta(key){ return JLEVELS.find(x=>x.key===key)||null; }
function levelLabel(key){ const m=levelMeta(key); return m?m.label:(key||''); }
// 投稿实际勾选的等级数组
function subLevels(s){ return (s&&Array.isArray(s.levels))?s.levels:[]; }
// 取最高优先级等级 key（用于显示）
function bestLevelKey(s){ const ls=subLevels(s); if(!ls.length) return ''; return ls.slice().sort((a,b)=>(LEVEL_RANK[b]||0)-(LEVEL_RANK[a]||0))[0]; }
// 显示文本：取最高值
function subZoneLabel(s){ const k=bestLevelKey(s); if(k) return levelLabel(k); if(s&&s.zone) return s.zone; return ''; }
// 全部等级文本（导出 / 搜索用）
function subLevelsText(s){ const ls=subLevels(s); if(ls.length) return ls.map(levelLabel).join('、'); if(s&&s.zone) return s.zone; return ''; }
// 卡片徽章：显示最高值，其余以次级标签呈现
function subZoneBadge(s){
  const ls=subLevels(s);
  if(!ls.length){ const z=s&&s.zone; return z?`<span class="badge b-zone">${esc(z)}</span>`:''; }
  const best=bestLevelKey(s); const rest=ls.filter(x=>x!==best).map(levelLabel);
  let h=`<span class="badge b-zone" title="${esc(ls.map(levelLabel).join(' / '))}">${esc(levelLabel(best))}</span>`;
  if(rest.length) h+=`<span class="badge b-zone2" title="同时收录于">${esc(rest.join('、'))}</span>`;
  return h;
}
// 由旧版自由文本分区推断等级 key（迁移用）
function inferLevel(zone){
  if(!zone) return '';
  const z=String(zone); let m;
  if((m=z.match(/jcr[\s_-]?q?\s*([1-4])/i))||(m=z.match(/q([1-4])/i))||(m=z.match(/([1-4])\s*区/i))) return 'jcr'+m[1];
  if(/cssci/i.test(z)){ if(/集刊|辑刊|series/i.test(z)) return 'cssci_series'; if(/扩展/.test(z)) return 'cssci_ext'; return 'cssci'; }
  if(/cscd|中国科学引文数据库|中科院.*引文/i.test(z)) return 'cscd';
  if(/ccf/i.test(z)){ const m=z.match(/c\s*c\s*f[-\s]?([abc])/i)||z.match(/([abc])\s*类/i); if(m) return 'ccf_'+m[1].toLowerCase(); return 'ccf_a'; }
  if(/北大|北核|中文核心/.test(z)) return 'pku';
  if(/scopus/i.test(z)) return 'scopus';
  if(/\bei\b|工程索引/i.test(z)) return 'ei';
  if(/普通|普刊|一般期刊/.test(z)) return 'ordinary';
  return '';
}
// 投稿表单中的多选 chips
function levelChipsHTML(selected){
  const sel=new Set(selected||[]);
  return JLEVELS.map(l=>`<label class="lvl-chip"><input type="checkbox" class="lvl-cb" value="${l.key}" ${sel.has(l.key)?'checked':''}><span class="lv-dot" style="background:${l.color}"></span>${l.label}</label>`).join('');
}
function readLevelCheckboxes(){ return Array.from(document.querySelectorAll('#f-levels .lvl-cb:checked')).map(c=>c.value); }

/* ===================== 期刊自动匹配 (easyScholar) ===================== */
// 从 easyScholar 返回数据识别所有命中的等级（JCR 不分 sci/ssci/ahci/esci，只取分区；其他核心库一并识别）
function detectLevels(all){
  const out=[];
  const jcrRaw = all.sci||all.ssci||all.ahci||all.esci||'';        // JCR 体系（含 ESCI）
  if(jcrRaw){ const q=String(jcrRaw).replace(/[^1-4]/g,''); if(q && '1234'.indexOf(q)>=0) out.push('jcr'+q); }
  // CSSCI：easyScholar 的 all.cssci 字段值是描述文本，如 "CSSCI"（正版）、"CSSCI扩展版" 或 "CSSCI集刊"
  if(all.cssci){
    const cv=String(all.cssci);
    if(/集刊|辑刊|series/i.test(cv)) out.push('cssci_series');        // CSSCI 集刊
    else if(/扩展/.test(cv)) out.push('cssci_ext');                  // CSSCI 扩展版
    else out.push('cssci');                                          // 南大核心（正版）
  }
  // CSCD：中国科学引文数据库（核心库）
  if(all.cscd){ const cv=String(all.cscd).trim(); if(/^(核心|cscd|1)$/i.test(cv)) out.push('cscd'); }
  // CCF：中国计算机学会推荐国际期刊 / 会议（A / B / C 类）
  if(all.ccf){ const ccfv=String(all.ccf).toUpperCase(); let m=ccfv.match(/CCF[-\s]?([ABC])/); if(!m) m=ccfv.match(/([ABC])/); if(m) out.push('ccf_'+m[1].toLowerCase()); }
  if(all.pku||all.pkucore||all['北大核心']) out.push('pku');   // 北大核心
  if(all.scopus) out.push('scopus');                               // Scopus
  // EI：工程索引（Engineering Index）
  if(all.ei){ const cv=String(all.ei).trim().toLowerCase(); if(cv && !/^(否|0|no|none|false)$/.test(cv)) out.push('ei'); }
  return out;
}
async function matchJournal(){
  const name=$('#f-journal').value.trim();
  const hint=$('#matchHint');
  if(!name){ hint.className='hint err'; hint.textContent=t('matchNoName'); return; }
  const key=getKey();
  if(!key){ hint.className='hint err'; hint.innerHTML=t('noKey'); return; }
  hint.className='hint'; hint.textContent=t('matching');
  try{
    const url=`https://www.easyscholar.cc/open/getPublicationRank?secretKey=${encodeURIComponent(key)}&publicationName=${encodeURIComponent(name)}`;
    const r=await fetch(url); const res=await r.json();
    if(res.code!==200){ hint.className='hint err'; hint.textContent=t('matchFail')+(res.msg||t('matchNotFound')); return; }
    const all=(((res.data||{}).officialRank||{}).all)||{};
    if(!all||!Object.keys(all).length){ hint.className='hint err'; hint.textContent=t('matchNotFound'); return; }
    const det=detectLevels(all);
    // 勾选识别到的等级（覆盖式：反映 API 结果）
    document.querySelectorAll('#f-levels .lvl-cb').forEach(cb=>{ cb.checked = det.includes(cb.value); });
    const ifv=all.sciif||all.sciif5||'';
    if(ifv) $('#f-if').value=ifv;
    const cust=$('#f-zone-custom'); if(cust){ cust.style.display=det.length?'none':''; if(det.length) cust.value=''; }
    const bits=[];
    if(det.length) bits.push(det.map(levelLabel).join('、'));
    if(ifv) bits.push('IF '+ifv);
    let msg=t('matchOk')+(bits.join(' · ')||'');
    if(!det.length) msg+=t('matchNoLevel');
    hint.className='hint ok'; hint.textContent=msg;
  }catch(e){ hint.className='hint err'; hint.textContent=t('matchErr')+e.message; }
}

        1. <a href="https://www.easyscholar.cc/" target="_blank">easyscholar.cc</a><br>
        2. 「我的信息 → 开放接口」<br>
        3. 复制密钥，粘贴到上方<br>
        <span style="color:var(--sub)">JCR Q1-Q4 / EI / Scopus / CSSCI / CSSCI扩展版 / 北大核心 / 中英文普刊。中文 SSCI / CSSCI 可在「期刊等级」手动选择。</span>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn primary" onclick="saveSettings()">${t('save')}</button>
    </div>
   </div>`;
  overlay.classList.add('open');
}
function saveSettings(){ setKey($('#s-key').value.trim()); setSelfName($('#s-self').value.trim()); closeModal(); toast(t('settingsSaved')); }

/* 更新日志 */
function openChangelog(){
  const rows=CHANGELOG.map(c=>`
    <div class="clog-ver">
      <div class="clog-head"><span class="clog-v">v${esc(c.v)}</span><span class="clog-date">${esc(c.date)}</span>${c.v===APP_VERSION?'<span class="clog-cur">当前</span>':''}</div>
      <ul class="clog-items">${c.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
    </div>`).join('');
  overlay.innerHTML=`
   <div class="modal" style="max-width:560px">
    <div class="modal-head"><h2>&#128220; ${t('changelog')}</h2><button class="x" onclick="closeModal()">&times;</button></div>
    <div class="modal-body" style="max-height:64vh;overflow:auto">${rows}</div>
    <div class="modal-foot"><button class="btn primary" onclick="closeModal()">${t('close')}</button></div>
   </div>`;
  overlay.classList.add('open');
}

/* ===================== 导入 / 导出 ===================== */
function exportData(){
  overlay.innerHTML=`
   <div class="modal">
    <div class="modal-head"><h2>&#128228; ${t('exportData')}</h2><button class="x" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <p style="margin-top:0;color:var(--sub);font-size:13px">${t('exportDesc')}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn primary" onclick="doExportJSON()">&#128190; ${t('exportJSON')}</button>
        <button class="btn" onclick="doExportCSV()">&#128202; ${t('exportCSV')}</button>
      </div>
    </div>
   </div>`;
  overlay.classList.add('open');
}
function download(name,content,type){
  const blob=new Blob([content],{type}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function doExportJSON(){ download(`投稿记录_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(DATA,null,2),'application/json'); toast(t('exportedJSON')); }
function doExportCSV(){
  const head=[t('projName'),t('paperTitle'),'EN',t('lang'),t('discField'),t('projStatus'),t('authors'),t('journal'),t('type'),t('levels'),t('impactFactor'),t('submitDate'),t('curStatus'),t('round'),t('nextDdl2'),t('progress'),t('subNote')];
  const rows=[];
  DATA.forEach(p=>{ const ast=(p.articleStatus==='working')?t('statWorking'):(p.articleStatus||t('completed'));
    (p.submissions||[]).forEach(s=>{ const c=currentEvent(s);
      rows.push([projNameText(p),paperBilingualText(p),p.titleEn||'',p.lang,(p.disciplines||[]).join('；'),ast,authorsExport(p),s.journal,s.type,subLevelsText(s),s.impactFactor,s.submitDate,SL(c.status),c.round,s.deadline,(s.timeline||[]).length,(s.note||'').replace(/\n/g,' ')]); });
    if(!(p.submissions||[]).length) rows.push([projNameText(p),paperBilingualText(p),p.titleEn||'',p.lang,(p.disciplines||[]).join('；'),ast,authorsExport(p),'','','','','','','','','','']);
  });
  const csv=[head,...rows].map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  download(`投稿记录_${new Date().toISOString().slice(0,10)}.csv`,'\ufeff'+csv,'text/csv'); toast(t('exportedCSV'));
}
function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ try{
      const arr=JSON.parse(rd.result); if(!Array.isArray(arr)) throw new Error('格式不对');
      const papers=arr.map(x=> normalizePaper(x && x.submissions ? x : migrateSub(x)));
      if(!confirm(t('importConfirm', papers.length))) return;
      const ids=new Set(DATA.map(x=>x.id));
      papers.forEach(x=>{ if(!x.id) x.id=uid(); if(!ids.has(x.id)){ DATA.push(x); ids.add(x.id);} });
      save(); if(VIEW.mode==='paper') renderPaper(); else renderGlobal(); toast(t('importSuccess'));
    }catch(err){ alert(t('importFail')+err.message); } };
    rd.readAsText(f); };
  inp.click();
}

/* ===================== 初始化 ===================== */
function initFilters(){
  const sel=$('#filterStatus');
  STATUS_ORDER.forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=SL(k); sel.appendChild(o); });
  const ow=document.createElement('option'); ow.value='working'; ow.textContent=t('statWorking')+'（'+t('nextDdl')+'）'; sel.appendChild(ow);
  const orv=document.createElement('option'); orv.value='revising'; orv.textContent=SL('revising'); sel.appendChild(orv);
}
/* 动态填充 学科 / 年度 / 作者 筛选项，保留当前选中值 */
function populateFilters(){
  const ds=$('#filterDiscipline'); const curDs=ds.value;
  const dset=allDisciplines();
  ds.innerHTML='<option value="">全部学科</option>'+dset.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('');
  ds.value=curDs;
  const as=$('#filterAuthor'); const curAs=as.value;
  const aset=[...new Set(DATA.flatMap(p=>(p.authorList||[]).map(a=>a.name)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh'));
  as.innerHTML='<option value="">全部作者</option>'+aset.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
  as.value=curAs;
  const ys=$('#filterYear'); const curY=ys.value;
  const yset=[...new Set(DATA.map(p=>paperYear(p)).filter(Boolean))].sort((a,b)=>b-a);
  ys.innerHTML='<option value="">全部年度</option>'+yset.map(y=>`<option value="${y}">${y} 年</option>`).join('');
  ys.value=curY;
}
$('#btnAdd').onclick=openNewPaper;
$('#btnChangelog').onclick=openChangelog;
$('#btnSettings').onclick=openSettings;
$('#btnExport').onclick=exportData;
$('#btnImport').onclick=importData;
$('#btnBack').onclick=goGlobal;
$('#btnNewSub').onclick=()=>openNewSub(VIEW.paperId);
$('#btnEditPaper').onclick=()=>openEditPaper(VIEW.paperId);
$('#search').oninput=()=>{ if(VIEW.mode==='global') renderGlobal(); };
$('#filterAuthor').onchange=()=>{ if(VIEW.mode==='global') renderGlobal(); };
$('#filterStatus').onchange=()=>{ if(VIEW.mode==='global') renderGlobal(); };
$('#filterDiscipline').onchange=()=>{ if(VIEW.mode==='global') renderGlobal(); };
$('#filterYear').onchange=()=>{ if(VIEW.mode==='global') renderGlobal(); };
$('#groupBy').onchange=()=>{ if(VIEW.mode==='global') renderGlobal(); };
$('#sortBy').onchange=()=>{ if(VIEW.mode==='global') renderGlobal(); };
$('#journalStatsSort').onchange=()=>{ journalStatsSort=$('#journalStatsSort').value; renderJournalStats(); };

load(); initFilters(); initLangSwitch(); applyStaticI18n(); renderGlobal();
renderFooter();
</script>
